<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gauge plate</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Pixel&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>body{margin:0}a{color:#FF5A1F}a:hover{color:#F2EEE8}</style>
</helmet>
<div style="width: 480px; height: 480px; box-sizing: border-box; padding: 36px; background: #000000; color: #F2EEE8; font-family: 'Geist Mono', ui-monospace, monospace; display: flex; flex-direction: column;">
  <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 2px solid #2A2622; font-size: 17px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; color: #6B655E;">
    <span>Battery</span><span>0–100</span>
  </div>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
    <div style="display: flex; align-items: flex-end; gap: 8px;">
      <span style="font-family: 'Geist Pixel', 'Geist Mono', monospace; font-size: 140px; line-height: 0.9;">84</span>
      <span style="font-size: 44px; font-weight: 600; color: #6B655E; padding-bottom: 18px;">%</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; height: 64px; margin-top: 26px;">
      <span style="background: #FF5A1F;"></span><span style="background: #FF5A1F;"></span><span style="background: #FF5A1F;"></span><span style="background: #FF5A1F;"></span><span style="background: #FF5A1F;"></span><span style="background: #FF5A1F;"></span><span style="background: #FF5A1F;"></span><span style="background: #FF5A1F;"></span><span style="background: #2A2622;"></span><span style="background: #2A2622;"></span>
    </div>
    <div style="font-size: 24px; font-weight: 500; color: #6B655E; margin-top: 14px;">About 3 hours left</div>
  </div>
  <div style="display: flex; justify-content: space-between; padding-top: 16px; border-top: 2px solid #2A2622; font-size: 15px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;">
    <span style="color: #6B655E;">Long-press · pin</span><span>Tap · details</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
