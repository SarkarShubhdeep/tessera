<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Presence: the ring</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Pixel&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5A1F}a:hover{color:#F2EEE8}
</style>
</helmet>
<div style="width: 2120px; height: 620px; box-sizing: border-box; padding: 40px; background: #0A0908; color: #F2EEE8; font-family: 'Geist Mono', ui-monospace, monospace; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px;">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="position: relative; width: 480px; height: 480px; background: #000000; overflow: hidden;">
        <span style="position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 24px; letter-spacing: 2px; color: #6B655E;">09:41</span>
        <sc-for list="{{s.segs}}" as="g" hint-placeholder-count="24"><span style="position: absolute; left: 240px; top: {{g.top}}px; width: {{g.len}}px; height: {{g.w}}px; background: {{accent}}; opacity: {{g.a}}; transform-origin: 0 50%; transform: rotate({{g.deg}}deg) translateX({{g.r}}px);"></span></sc-for>
        <span style="position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 24px;">{{s.status}}</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;"><span>{{s.name}}</span><span style="color: #8D867E;">{{s.note}}</span></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","options":["#FF5A1F","#F2EEE8","#FFB020"],"default":"#FF5A1F"},"$preview":{"width":2120,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    /* Still frames of the presence ring, same geometry as the landing page (site/index.html):
       24 square segments around a 64-unit radius, centred at (240, 236) on the 480 screen.
       Motion lives on the landing page; these are representative moments of each state. */
    if (!this._states) {
      const N = 24, cy = 236;
      const voice = (i, seed) => 0.55 + 0.45 * Math.abs(Math.sin(i * 1.9 + seed));
      const ring = (fn) => {
        const out = [];
        for (let i = 0; i < N; i++) {
          const g = fn(i);
          out.push({ deg: (i / N * 360 - 90).toFixed(2), r: g.r, len: g.len.toFixed(1), w: g.w, a: g.a.toFixed(2), top: (cy - g.w / 2).toFixed(1) });
        }
        return out;
      };
      this._states = [
        { name: 'Idle', status: 'Tap to talk', note: 'Solid ring · breathes',
          segs: ring(() => ({ r: 64, len: 12, w: 16.9, a: 1 })) },
        { name: 'Listening', status: 'Listening', note: 'Follows your voice',
          segs: ring((i) => ({ r: 74, len: 12 + 58 * voice(i, 0.7) * (0.35 + 0.65 * Math.abs(Math.sin(i * 1.9 + 2.1))), w: 12, a: 1 })) },
        { name: 'Thinking', status: 'Thinking', note: 'A lit arc circling',
          segs: ring((i) => { const d = (7 - i + N) % N; return { r: 64, len: d < 2.5 ? 22 : 12, w: 12, a: Math.max(0.22, 1 - d / 13) }; }) },
        { name: 'Speaking', status: 'Speaking', note: 'Follows its voice',
          segs: ring((i) => { const m = Math.min(i, N - i) / (N / 2); return { r: 70, len: 12 + 50 * (0.4 + 0.6 * Math.abs(Math.sin(m * 5.1 + 1.3))), w: 12, a: 1 }; }) }
      ];
    }
    return { states: this._states, accent: this.props.accent ?? '#FF5A1F' };
  }
}
</script>
</body>
</html>
