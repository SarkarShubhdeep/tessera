<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The pixel orb</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Pixel&amp;family=Geist+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5A1F}a:hover{color:#F2EEE8}
.ts-disc{position:absolute;left:50%;top:50%;width:176px;height:176px;margin:-88px 0 0 -88px}
.ts-px{position:absolute;width:var(--s);height:var(--s);background:var(--accent)}
@keyframes ts-breathe{from{transform:scale(.92)}to{transform:scale(1)}}
@keyframes ts-twinkle{0%,88%,100%{opacity:1}93%{opacity:.15}}
@keyframes ts-ripple{0%,60%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(calc(var(--ux) * 12px),calc(var(--uy) * 12px)) scale(.7)}}
@keyframes ts-spin{to{transform:rotate(360deg)}}
@keyframes ts-shatter{0%,12%,88%,100%{transform:translate(0,0) rotate(0)}38%,62%{transform:translate(calc(var(--ux) * var(--sh) * (0.45 + var(--k) * 0.55)),calc(var(--uy) * var(--sh) * (0.45 + var(--k) * 0.55))) rotate(90deg) scale(.8)}}
@keyframes ts-beat{from{transform:scale(.5)}to{transform:scale(1)}}
.s-idle .ts-disc{animation:ts-breathe calc(2.4s / var(--v)) ease-in-out infinite alternate}
.s-idle .ts-px{animation:ts-twinkle calc(3.6s / var(--v)) linear infinite;animation-delay:calc(var(--k) * -3.6s)}
.s-listen .ts-px{animation:ts-ripple calc(.9s / var(--v)) cubic-bezier(.16,1,.3,1) infinite;animation-delay:calc(var(--r) * 60ms / var(--v))}
.s-think .ts-disc{animation:ts-spin calc(3.2s / var(--v)) cubic-bezier(.65,0,.35,1) infinite}
.s-think .ts-px{animation:ts-shatter calc(3.2s / var(--v)) cubic-bezier(.65,0,.35,1) infinite;animation-delay:calc(var(--k) * -.25s)}
.s-speak .ts-px{animation:ts-beat calc(.26s / var(--v)) ease-in-out infinite alternate;animation-delay:calc(var(--r) * -45ms / var(--v))}
@media (prefers-reduced-motion:reduce){.ts-disc,.ts-px{animation:none!important}}
</style>
</helmet>
<div style="width: 2120px; height: 620px; box-sizing: border-box; padding: 40px; background: #0A0908; color: #F2EEE8; font-family: 'Geist Mono', ui-monospace, monospace; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px; --s: {{size}}px; --sh: {{shatter}}px; --v: {{speed}}; --accent: {{accent}};">
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="s-idle" style="position: relative; width: 480px; height: 480px; background: #000000; overflow: hidden;">
      <span style="position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 24px; letter-spacing: 2px; color: #6B655E;">09:41</span>
      <div class="ts-disc">
        <sc-for list="{{pixels}}" as="p" hint-placeholder-count="97"><span class="ts-px" style="left: {{p.x}}px; top: {{p.y}}px; --ux: {{p.ux}}; --uy: {{p.uy}}; --r: {{p.r}}; --k: {{p.k}};"></span></sc-for>
      </div>
      <span style="position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 24px;">Tap to talk</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;"><span>Idle</span><span style="color: #8D867E;">Breathes · pixels flicker</span></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="s-listen" style="position: relative; width: 480px; height: 480px; background: #000000; overflow: hidden;">
      <span style="position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 24px; letter-spacing: 2px; color: #6B655E;">09:41</span>
      <div class="ts-disc">
        <sc-for list="{{pixels}}" as="p" hint-placeholder-count="97"><span class="ts-px" style="left: {{p.x}}px; top: {{p.y}}px; --ux: {{p.ux}}; --uy: {{p.uy}}; --r: {{p.r}}; --k: {{p.k}};"></span></sc-for>
      </div>
      <span style="position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 24px;">Listening</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;"><span>Listening</span><span style="color: #8D867E;">Ripples out, ring by ring</span></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="s-think" style="position: relative; width: 480px; height: 480px; background: #000000; overflow: hidden;">
      <span style="position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 24px; letter-spacing: 2px; color: #6B655E;">09:41</span>
      <div class="ts-disc">
        <sc-for list="{{pixels}}" as="p" hint-placeholder-count="97"><span class="ts-px" style="left: {{p.x}}px; top: {{p.y}}px; --ux: {{p.ux}}; --uy: {{p.uy}}; --r: {{p.r}}; --k: {{p.k}};"></span></sc-for>
      </div>
      <span style="position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 24px;">Thinking</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;"><span>Thinking</span><span style="color: #8D867E;">Shatters · revolves · reforms</span></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div class="s-speak" style="position: relative; width: 480px; height: 480px; background: #000000; overflow: hidden;">
      <span style="position: absolute; top: 40px; left: 0; right: 0; text-align: center; font-size: 24px; letter-spacing: 2px; color: #6B655E;">09:41</span>
      <div class="ts-disc">
        <sc-for list="{{pixels}}" as="p" hint-placeholder-count="97"><span class="ts-px" style="left: {{p.x}}px; top: {{p.y}}px; --ux: {{p.ux}}; --uy: {{p.uy}}; --r: {{p.r}}; --k: {{p.k}};"></span></sc-for>
      </div>
      <span style="position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; font-size: 24px;">Speaking</span>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;"><span>Speaking</span><span style="color: #8D867E;">Beats from the centre out</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"grid":{"editor":"enum","options":["9","11","15","21"],"default":"11","section":"Pixels"},"gap":{"editor":"int","min":0,"max":6,"step":1,"unit":"px","default":2,"section":"Pixels"},"shatter":{"editor":"range","min":10,"max":120,"step":5,"unit":"px","default":60,"section":"Motion"},"speed":{"editor":"range","min":0.5,"max":2,"step":0.1,"default":1,"section":"Motion"},"accent":{"editor":"color","options":["#FF5A1F","#F2EEE8","#FFB020","#3DDC97"],"default":"#FF5A1F","section":"Colour"},"$preview":{"width":2120,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    /* A grid of square pixels across a 176 px disc, kept where each falls inside the circle.
       ux/uy point outward from the centre; r is the ring; k is a stable per-pixel random for stagger. */
    const n = parseInt(this.props.grid ?? '11', 10) || 11;
    const gap = Math.max(0, Math.min(6, Number(this.props.gap ?? 2)));
    const pitch = 176 / n;
    const size = Math.max(1, pitch - gap);
    const key = n + ':' + gap;
    if (this._key !== key) {
      const c = (n - 1) / 2, out = [];
      for (let j = 0; j < n; j++) {
        for (let i = 0; i < n; i++) {
          const dx = i - c, dy = j - c, d = Math.sqrt(dx * dx + dy * dy);
          if (d > c + 0.45) continue;
          const len = d || 1;
          const k = ((i * 73 + j * 151 + i * j * 7) % 97) / 97;
          out.push({
            x: (i * pitch + gap / 2).toFixed(2), y: (j * pitch + gap / 2).toFixed(2),
            ux: (dx / len).toFixed(3), uy: (dy / len).toFixed(3),
            r: Math.round(d * 11 / n), k: k.toFixed(3)
          });
        }
      }
      this._key = key;
      this._pixels = out;
    }
    return {
      pixels: this._pixels,
      size: size.toFixed(2),
      shatter: Number(this.props.shatter ?? 60),
      speed: Number(this.props.speed ?? 1),
      accent: this.props.accent ?? '#FF5A1F'
    };
  }
}
</script>
</body>
</html>
