.ts-breathe{animation:ts-breathe 2.4s ease-in-out infinite alternate}
.ts-pulse{animation:ts-pulse .26s ease-out infinite alternate}
.ts-bar{animation:ts-bar .36s ease-in-out infinite alternate}
.ts-fade{animation:ts-fade .42s ease-in-out infinite alternate}
